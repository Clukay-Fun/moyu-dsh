<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>摸鱼工具箱 · 开始使用</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px system-ui;background:#f4f5f8;color:#20222a}
  main{width:min(560px,calc(100vw - 64px));padding:32px;border:1px solid #d9dce5;border-radius:18px;background:#fff;box-shadow:0 18px 60px #10182818}
  h1{font-size:22px;margin:0 0 12px}
  p{line-height:1.65;color:#555b6b;margin:0 0 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  button{font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #d9dce5;background:#fff;color:#20222a;cursor:pointer}
  button.primary{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
  button:disabled{opacity:.5;cursor:default}
  @media (prefers-color-scheme: dark){
    body{background:#15171c;color:#e8eaf0}
    main{background:#1c1f26;border-color:#2b2f3a;box-shadow:none}
    p{color:#a6acbb}
    button{background:#232734;border-color:#333949;color:#e8eaf0}
  }
</style>
<main>
  <h1>开始使用</h1>
  <p>还没有配置模型凭据。可以现在进入 DSH 配置，也可以直接使用不需要联网的传统工具（图片、PDF、条码、截图）。</p>
  <div class="row">
    <button class="primary" id="continue">进入 DSH 配置凭据</button>
    <button id="legacy">打开传统工具</button>
  </div>
</main>
<script>
  const guard = (button, action) => button.addEventListener('click', async () => {
    button.disabled = true
    try { await action() } finally { button.disabled = false }
  })
  guard(document.getElementById('continue'), () => window.moyuOnboarding.continueToDsh())
  guard(document.getElementById('legacy'), () => window.moyuOnboarding.openLegacy())
</script>

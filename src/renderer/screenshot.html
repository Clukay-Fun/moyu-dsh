<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self'; style-src 'self'; img-src 'self' data: blob:"
    />
    <title>选择截图区域</title>
    <link rel="stylesheet" href="./screenshot.css" />
  </head>
  <body>
    <canvas id="capture-canvas"></canvas>
    <div class="selection-size" id="selection-size" hidden></div>
    <div class="capture-actions" id="capture-actions" hidden>
      <button id="cancel-capture" type="button">取消 Esc</button>
      <button class="primary" id="confirm-capture" type="button">完成 Enter</button>
    </div>
    <div class="capture-tip" id="capture-tip">拖动选择截图区域 · Esc 取消</div>
    <script type="module" src="./screenshot.js"></script>
  </body>
</html>
